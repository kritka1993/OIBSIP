<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Library Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .reg-card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1e3a8a; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4b5563; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        .btn { display: block; width: 100%; padding: 0.75rem; background: #059669; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #047857; }
        .switch-link { text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #4b5563; }
        .switch-link a { color: #059669; text-decoration: none; }
    </style>
</head>
<body>
<div class="reg-card">
    <h2>Create Account</h2>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" th:field="*{username}" required />
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" required />
        </div>
        <div class="form-group">
            <label>System Role</label>
            <select th:field="*{role}">
                <option value="ROLE_USER">Library Member (User)</option>
                <option value="ROLE_ADMIN">System Administrator</option>
            </select>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <div class="switch-link">
        Already registered? <a href="/login">Sign in here</a>
    </div>
</div>
</body>
</html>
